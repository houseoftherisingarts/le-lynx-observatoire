              }

    <style>
      body {
        background-color: #02040a;
        color: #e2e8f0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Refined Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
        border: 2px solid #020617;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* High-End Glassmorphism - Dark Store Aesthetic */
      .glass-panel {
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
      }

      .glass-card {
        background: rgba(20, 20, 20, 0.4);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }
      
      /* Smooth transitions for glass cards */
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.08);
      }

      /* 3D Transform Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }

      /* ---- Foil irisé Vexel, porté de l'Alliance alimentaire le 14 septembre 2026 ----
         Les cinq teintes du foil de l'autocollant (rose, or, menthe, bleu ciel, mauve), sorties de
         l'autocollant pour servir partout : un titre, un anneau, un flash de transition. Ordre d'Alex du
         14 septembre 2026, qui veut voir l'iridescent davantage dans les communications et les modules. */
      :root {
        --irise: #ff9ecb, #ffe08a, #9bffcf, #8ad4ff, #c9a4ff, #ff9ecb;
      }

      /* Un texte rempli par le foil, qui balaie lentement. Le repli, si le navigateur ne sait pas
         découper un fond sur du texte, est la couleur héritée : le mot reste lisible. */
      .texte-irise {
        background-image: linear-gradient(100deg, var(--irise));
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: irise-balaie 9s linear infinite;
        filter: drop-shadow(0 0 22px rgb(255 255 255 / 0.18));
      }
      @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
        .texte-irise { color: #ffe08a; -webkit-text-fill-color: #ffe08a; background-image: none; }
      }
      @keyframes irise-balaie {
        from { background-position: 0% 50%; }
        to { background-position: 260% 50%; }
      }

      /* La feuille foil : l'autocollant Vexel en plein écran. Mêmes trois couches que `.xh-foil` du pied de
         page (charbon, voile irisé en color-dodge, grain), pour que l'écran de bienvenue d'une démo
         appartienne visiblement au studio et jamais au canon du client. */
      .feuille-foil {
        background:
          radial-gradient(120% 120% at 32% 26%, rgb(255 255 255 / 0.07), transparent 58%),
          linear-gradient(135deg, #1b1b22 0%, #050505 58%, #14141a 100%);
        color: #fff;
        isolation: isolate;
      }
      .feuille-foil-voile {
        position: absolute;
        inset: -45%;
        pointer-events: none;
        /* Le conic de l'autocollant couvre quelques centimètres; étalé sur un écran entier, ses secteurs
           deviennent des lames de couleur. Un flou large les fond en reflets, et l'opacité tombe à un
           dixième : le charbon reste la matière, l'irisé n'est que la lumière qui glisse dessus. */
        background: repeating-conic-gradient(from 200deg at 50% 50%, #ff9ecb 0deg, #ffe08a 24deg, #9bffcf 48deg, #8ad4ff 72deg, #c9a4ff 96deg, #ff9ecb 120deg);
        opacity: 0.1;
        mix-blend-mode: screen;
        filter: saturate(1.15) blur(90px);
        animation: foil-pivote 30s linear infinite;
        z-index: 0;
      }

      /* Un second reflet, plus serré et plus lent, qui donne la profondeur du foil sans ajouter de couleur
         franche : les deux couches ne tournent pas à la même vitesse, donc la lumière ne se répète jamais. */
      .feuille-foil-voile-2 {
        position: absolute;
        inset: -30%;
        pointer-events: none;
        background: conic-gradient(from 40deg at 38% 62%, #8ad4ff, #c9a4ff, #ff9ecb, #ffe08a, #9bffcf, #8ad4ff);
        opacity: 0.14;
        mix-blend-mode: screen;
        filter: saturate(1.1) blur(120px);
        animation: foil-pivote 52s linear infinite reverse;
        z-index: 0;
      }
      @keyframes foil-pivote {
        from { transform: rotate(0deg) scale(1.08); }
        to { transform: rotate(360deg) scale(1.08); }
      }

      /* Le bouton irisé du module Vexel : la pilule prend le foil, le texte reste charbon pour le contraste. */
      .bouton-irise {
        background-image: linear-gradient(105deg, var(--irise));
        background-size: 260% 100%;
        color: #14141a;
        animation: irise-balaie 9s linear infinite;
        box-shadow: 0 10px 30px -12px rgb(255 255 255 / 0.45);
      }

      /* La vignette du mode visite : l'écran se referme par les bords, sans jamais découper un trou
         rectangulaire au milieu de la page. Un liseré irisé sur le pourtour dit que la visite est en cours. */
      .vignette-visite {
        background: radial-gradient(ellipse 76% 66% at 50% 48%, transparent 34%, rgb(var(--c-encre) / 0.34) 72%, rgb(var(--c-encre) / 0.74) 100%);
      }
      .lisere-irise::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        background: linear-gradient(115deg, var(--irise)) border-box;
        background-size: 300% 100%;
        -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.55;
        animation: irise-balaie 7s linear infinite;
      }

      /* L'anneau irisé posé autour de l'élément dont la visite parle. */
      .anneau-irise {
        border: 2px solid transparent;
        background: linear-gradient(120deg, var(--irise)) border-box;
        background-size: 300% 100%;
        -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: irise-balaie 6s linear infinite;
        box-shadow: 0 0 34px rgb(255 255 255 / 0.22);
      }

      /* Le flash de passage vers la visite : un disque irisé qui s'ouvre et se dissout. */
      .flash-irise {
        background:
          radial-gradient(circle at 50% 50%, rgb(255 255 255 / 0.95) 0%, rgb(255 255 255 / 0.5) 18%, transparent 46%),
          conic-gradient(from 0deg at 50% 50%, var(--irise));
        filter: blur(6px) saturate(1.3);
      }

      /* Autocollants foil du pied de page (components/BadgeVexel.tsx). */
      .xh-foil, .xh-foil-plat {
        --mx: 30%; --my: 30%; --rx: 0deg; --ry: 0deg;
        color: #fff;
        background:
          radial-gradient(120% 120% at var(--mx) var(--my), rgb(255 255 255 / 0.18), transparent 55%),
          linear-gradient(135deg, #1b1b22 0%, #050505 60%, #14141a 100%);
        overflow: hidden;
      }
      .xh-foil:hover .xh-foil-sheen { opacity: 0.32; }
      .xh-foil-plat .xh-foil-sheen { opacity: 0.12; filter: saturate(1.1) blur(28px); }
      .xh-foil-grain {
        position: absolute; inset: 0;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
        mix-blend-mode: soft-light;
        opacity: 0.35;
        z-index: 0;
      }
      .xh-foil > *:not(.xh-foil-sheen):not(.xh-foil-grain),
      .xh-foil-plat > *:not(.xh-foil-sheen):not(.xh-foil-grain) { z-index: 1; }
    </style>
